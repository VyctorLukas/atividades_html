<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 2 :]</title>
</head>
<body>
    <form>
        <p style="font-weight: bold; font-size: 24px;">Formulário de Inscrição</p>
        
        <b>Preencha seus dados</b> <br><br>
        
        <label for="nome">Nome:</label>
        <input type="text" name="nome" size="25" maxlength="30">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" name="email" size="25" maxlength="50">
        <br><br>
        <label for="endereco">Endereço:</label>
        <input type="text" name="endereco" size="50" maxlength="80">
        <br><br>
        <label for="cidade">Cidade:</label>
        <input type="text" name="cidade" size="52" maxlength="80">
        <br><br>
        <label for="telefone">Telefone:</label>
        <input type="text" name="ddd" size="2" maxlength="2">
        <input type="text" name="telefone" size="10" maxlength="10">
        <br><br>
        <label for="user">Usuário:</label>
        <input type="text" name="user" size="20" maxlength="20" placeholder="Entre com o seu login">
        <br><br>
        <label for="password">Senha:</label>
        <input type="password" name="password" size="22" maxlength="20">
        <br><br>

        <input type="submit" name="enviar" value="Finalizar minha inscrição">
    </form>
</body>
</html>
