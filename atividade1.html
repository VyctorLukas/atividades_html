<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 1 :]</title>
</head>
<body>
    <form align="left">
        <h1 align="center">Ficha Cadastral</h1>
        <br>
        <label for="nome">Nome:</label>
        <input type="text" name="nome" size="15" maxlength="30" placeholder="insira seu nome...">
        <br><br>
        <label for="rg">RG:</label>
        <input type="text" name="rg" size="10" maxlength="13" placeholder="insira seu rg...">
        <br><br>
        <label for="cpf">CPF:</label>
        <input type="text" name="cpf" maxlength="14" size="15" placeholder="insira seu cpf...">
        <br><br>
        <label for="endereco">Endereço:</label>
        <input type="text" name="endereco" size="25" maxlength="50" placeholder="insira seu endereço...">
        <br><br>
        <label for="sexo">Sexo:</label>
        <select name="sexo" size="1" value="Masculino">
            <option>Masculino</option>
            <option>Feminino</option>
        </select>
        <br><br>
        <label for="nascimento">Data de nascimento:</label>
        <input type="date" size="10" maxlength="10" name="nascimento">
        <br><br>
        <label for="civil">Situação Civil:</label>
        <input type="radio" name="civil"> Casado
        <input type="radio" name="civil"> Solteiro
        <input type="radio" name="civil"> Viúvo(a)
        <br><br>
       
        <input type="reset" name="clean" value="Limpar Dados">

    </form> 
</body>
</html>
